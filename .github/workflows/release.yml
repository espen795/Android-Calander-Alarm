name: Release
# Push a tag like v2.7.0 to build a signed APK, publish a server image to GHCR
# and create a GitHub Release. Required repository secrets (Settings → Secrets → Actions):
#   ANDROID_KEYSTORE_BASE64   base64 of your release .jks  (base64 -w0 release.jks)
#   ANDROID_KEYSTORE_PASSWORD
#   ANDROID_KEY_ALIAS
#   ANDROID_KEY_PASSWORD
# Optional repository variables (Settings → Variables → Actions): CALALARM_API_URL,
# CALALARM_UPDATE_SERVER_URL, CALALARM_CERT_PINS, CALALARM_APPLICATION_ID,
# CALALARM_UPDATE_SIGNER_SHA256.
#
# Supply-chain notes:
# - `uses:` are pinned to major tags; pin to full commit SHAs for maximum safety
#   (resolve with `git ls-remote https://github.com/<owner>/<repo> refs/tags/v*`).
# - gitleaks-action needs GITLEAKS_LICENSE only for organization repos; this repo
#   scans with the license-free community build, so no license env is set.
# - Secrets are only ever referenced via ${{ secrets.* }} / ${{ vars.* }}; they are
#   never echoed, logged, or written into the repo tree (keystore goes to $RUNNER_TEMP
#   and is deleted in the same step that uses it).
# - Minimal permissions: contents:write + packages:write are required for the
#   release + GHCR push; everything else defaults to none.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write   # create the GitHub Release
  packages: write   # push the server image to GHCR

jobs:
  guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - run: tools/sanitize-check.sh
      - name: Tag must match versionName
        run: |
          set -euo pipefail
          V=$(grep -oP 'versionName = "\K[^"]+' android/app/build.gradle.kts)
          test "v$V" = "${GITHUB_REF_NAME}" || { echo "Tag ${GITHUB_REF_NAME} != versionName v$V"; exit 1; }

  apk:
    needs: guard
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    env:
      ORG_GRADLE_PROJECT_CALALARM_API_URL: ${{ vars.CALALARM_API_URL }}
      ORG_GRADLE_PROJECT_CALALARM_UPDATE_SERVER_URL: ${{ vars.CALALARM_UPDATE_SERVER_URL }}
      ORG_GRADLE_PROJECT_CALALARM_CERT_PINS: ${{ vars.CALALARM_CERT_PINS }}
      ORG_GRADLE_PROJECT_CALALARM_UPDATE_SIGNER_SHA256: ${{ vars.CALALARM_UPDATE_SIGNER_SHA256 }}
      ORG_GRADLE_PROJECT_CALALARM_APPLICATION_ID: ${{ vars.CALALARM_APPLICATION_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - name: Decode keystore (never written into the repo tree)
        env:
          KS: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          test -n "$KS" || { echo "ANDROID_KEYSTORE_BASE64 secret missing"; exit 1; }
          echo "$KS" | base64 -d > "$RUNNER_TEMP/release.jks"
          chmod 600 "$RUNNER_TEMP/release.jks"
      - name: Build signed release APK
        env:
          ORG_GRADLE_PROJECT_KEYSTORE_PATH: ${{ runner.temp }}/release.jks
          ORG_GRADLE_PROJECT_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ORG_GRADLE_PROJECT_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ORG_GRADLE_PROJECT_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          cp gradle.properties.template gradle.properties
          ./gradlew --no-configuration-cache :app:testDebugUnitTest :app:assembleRelease
          rm -f "$RUNNER_TEMP/release.jks"   # keystore never survives the step
          shred -u gradle.properties 2>/dev/null || rm -f gradle.properties
      - name: Package assets
        run: |
          set -euo pipefail
          mkdir -p ../dist
          cp app/build/outputs/apk/release/app-release.apk "../dist/calendar-alarm-${GITHUB_REF_NAME}.apk"
          cd ../dist && python3 ../tools/make_version_json.py "calendar-alarm-${GITHUB_REF_NAME}.apk" "${GITHUB_REF_NAME#v}" > version.json
          sha256sum calendar-alarm-*.apk version.json > SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  server-image:
    needs: guard
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        run: echo "image=ghcr.io/${GITHUB_REPOSITORY,,}-server" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v6
        with:
          context: server
          push: true
          tags: |
            ${{ steps.meta.outputs.image }}:${{ github.ref_name }}
            ${{ steps.meta.outputs.image }}:latest

  publish:
    needs: [apk, server-image]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          # Extract the CHANGELOG section for this version (handles both
          # "## v2.7.0" and "## [2.7.0]" headers); falls back to a pointer.
          NOTES=$(awk -v v="${GITHUB_REF_NAME#v}" '
            $0 ~ ("^## \\[?v?" v "(\\]|$| )") { f=1; next }
            /^## / { if (f) exit }
            f { print }
          ' CHANGELOG.md)
          gh release create "$GITHUB_REF_NAME" dist/* \
            --title "Calendar Alarm $GITHUB_REF_NAME" \
            --notes "${NOTES:-See CHANGELOG.md for details.}"
